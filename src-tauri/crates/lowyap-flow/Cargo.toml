[package]
name = "lowyap-flow"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pure-Rust bilingual script-lock, Devanagari-to-Roman-Hinglish transliteration, and Whisper silence/repetition hallucination guard for lowyap"

[dependencies]
lowyap-ports = { path = "../lowyap-ports" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
