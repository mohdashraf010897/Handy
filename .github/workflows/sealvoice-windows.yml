name: "windows-test"
# Fork-only Windows x64 test job. Upstream runs Rust tests on Ubuntu only.
on:
  workflow_dispatch:
  push:
    branches: [ci/no-ticket/windows-tests]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  SMOKE_REPO: handy-computer/moonshine-tiny-gguf
  SMOKE_REV: f5c11906eba3f44cf305eed30feb9cbfb0b4b9d0
  SMOKE_FILE: moonshine-tiny-Q8_0.gguf
  SMOKE_SHA256: 2fd348d7b38f97d309cc3ec6848f3f57f537b80244950f07d2637e463f95a3a1

jobs:
  rust-tests:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Enable long paths
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: win-x64-tests
          cache-on-failure: true
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      - name: Install SPIRV-Headers
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$prefix"
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  build-smoke:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Enable long paths
        shell: pwsh
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          git config --system core.longpaths true
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: win-x64-release
          cache-bin: false
          cache-on-failure: true
      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      - name: Install SPIRV-Headers
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$prefix"
      - name: Locate VC++ runtime redist (app-local bundling)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -property installationPath
          $ver = (Get-Content (Join-Path $vsRoot "VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt")).Trim()
          $archDir = Join-Path $vsRoot "VC\Redist\MSVC\$ver\x64"
          $crt = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.CRT" | Sort-Object Name | Select-Object -Last 1
          $omp = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.OpenMP" | Sort-Object Name | Select-Object -Last 1
          if (-not $crt -or -not $omp) { throw "VC++ redist dirs not found under $archDir" }
          Add-Content -Path $env:GITHUB_ENV -Value "HANDY_VC_REDIST_DIRS=$($crt.FullName);$($omp.FullName)"

      - name: Install frontend dependencies
        run: bun install
      - name: Lint
        run: bun run lint
      - name: Flow script tests
        run: |
          bun src/components/flow/toneRules.test.ts
          bun src/stores/flowStore.test.ts

      # Unsigned test build; updater artifacts need the release key (SV-61).
      - name: Build unsigned NSIS installer
        shell: pwsh
        run: |
          $cfg = '{"bundle":{"createUpdaterArtifacts":false}}'
          $cfg | Set-Content -Encoding ascii "$env:RUNNER_TEMP\ci-conf.json"
          bun tauri build --bundles nsis -c "$env:RUNNER_TEMP\ci-conf.json"
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-unsigned-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Fetch smoke model into HF cache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $hf = "$env:RUNNER_TEMP\hf"
          Add-Content $env:GITHUB_ENV "HF_HOME=$hf"
          $env:HF_HOME = $hf
          python -m pip install --quiet "huggingface_hub>=0.34"
          $path = (python -c "from huggingface_hub import hf_hub_download as d; print(d('$env:SMOKE_REPO','$env:SMOKE_FILE',revision='$env:SMOKE_REV'))").Trim()
          $sha = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne $env:SMOKE_SHA256) { throw "model sha256 mismatch: $sha" }
          Write-Host "model ok: $path"

      - name: Generate 16 kHz mono WAV
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          Write-Host ("voices: " + (($s.GetInstalledVoices() | ForEach-Object { $_.VoiceInfo.Name }) -join ', '))
          $fmt = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(16000, [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
          $s.SetOutputToWaveFile("$env:RUNNER_TEMP\hello.wav", $fmt)
          $s.Speak("Hello world, this is a dictation test.")
          $s.Dispose()
          if ((Get-Item "$env:RUNNER_TEMP\hello.wav").Length -lt 10000) { throw "wav too small" }

      - name: Silent install and headless transcription smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $p = Start-Process $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit $($p.ExitCode)" }
          $exe = Get-ChildItem "$env:LOCALAPPDATA","$env:ProgramFiles" -Recurse -Filter 'lowyap.exe' -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\target\\' } | Select-Object -First 1
          if (-not $exe) { throw "installed lowyap.exe not found" }
          Write-Host "installed: $($exe.FullName)"
          Get-ChildItem $exe.DirectoryName | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          $out = "$env:RUNNER_TEMP\smoke.json"; $err = "$env:RUNNER_TEMP\smoke.err"
          $cliArgs = @('--transcribe-file', "$env:RUNNER_TEMP\hello.wav", '--model', "$env:SMOKE_REPO/$env:SMOKE_FILE", '--json')
          $r = Start-Process $exe.FullName -ArgumentList $cliArgs -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput $out -RedirectStandardError $err
          Get-Content $err -Tail 25 | Write-Host
          if ($r.ExitCode -ne 0) { throw "transcribe exit $($r.ExitCode)" }
          $j = Get-Content $out -Raw | ConvertFrom-Json
          Write-Host "text='$($j.text)' backend=$($j.bound_backend) rtf=$($j.rtf)"
          if ($j.text -notmatch '(?i)hello|dictation|test') { throw "unexpected transcript: '$($j.text)'" }

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-smoke-logs
          path: |
            ${{ runner.temp }}/smoke.json
            ${{ runner.temp }}/smoke.err
            ${{ runner.temp }}/hello.wav
          if-no-files-found: ignore
